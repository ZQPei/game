name: Deploy game catalog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out game catalog
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check out Magic Tower
        uses: actions/checkout@v6
        with:
          repository: ZQPei/mota
          ref: main
          path: sources/mota
          persist-credentials: false
      - name: Check out Saltline mirror
        uses: actions/checkout@v6
        with:
          repository: realcodebear/saltline-fable-5.2
          ref: 09c51774cd77aad750bd2d6c42af2b1020cb668d
          path: sources/saltline
          persist-credentials: false
      - name: Check out Splendor Pokémon
        uses: actions/checkout@v6
        with:
          repository: ZQPei/splendor-pokemon
          ref: main
          path: sources/splendor-pokemon
          persist-credentials: false
      - name: Assemble site
        shell: bash
        env:
          ROOM_SERVER: ${{ vars.SPLENDOR_POKEMON_ROOM_SERVER }}
        run: |
          set -euo pipefail
          mkdir -p public/assets public/mota public/saltline public/splendor-pokemon
          install -m 644 index.html public/index.html
          install -m 644 assets/*.webp public/assets/
          git -C sources/mota archive HEAD | tar -x -C public/mota
          install -m 644 sources/saltline/index.html public/saltline/index.html
          git -C sources/splendor-pokemon archive HEAD:dist | tar -x -C public/splendor-pokemon
          test -f public/mota/index.html
          test -f public/splendor-pokemon/index.html
          if [[ -n "$ROOM_SERVER" ]]; then
            python3 - <<'PY'
          import html
          import os
          from pathlib import Path
          from urllib.parse import urlsplit

          server = os.environ["ROOM_SERVER"].strip().rstrip("/")
          url = urlsplit(server)
          if (url.scheme != "https" or not url.hostname or url.username or url.password
              or url.path or url.query or url.fragment):
              raise SystemExit("SPLENDOR_POKEMON_ROOM_SERVER must be an HTTPS origin")

          page = Path("public/splendor-pokemon/index.html")
          marker = '<meta name="room-server" content="">'
          source = page.read_text(encoding="utf-8")
          if source.count(marker) != 1:
              raise SystemExit("Missing room-server metadata in the game page")
          page.write_text(source.replace(marker, f'<meta name="room-server" content="{html.escape(server)}">'), encoding="utf-8")
          PY
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
